[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symplectic-stiefel-nearness"
version = "0.1.0"
description = "Batched FP64 GPU solver for the nearest real symplectic Stiefel matrix problem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.5",
    "cupy-cuda12x==13.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symplectic_projection = ["*.cu"]
